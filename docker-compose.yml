version: '3.9'

services:
  mongodb:
    image: mongo:6
    ports: ['27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports: ['3001:3001']
    env_file: .env.local
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker-etl:
    build:
      context: .
      dockerfile: apps/worker-etl/Dockerfile
    env_file: .env.local
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker-scrape:
    build:
      context: .
      dockerfile: apps/worker-scrape/Dockerfile
    env_file: .env.local
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['3000:3000']
    env_file: .env.local
    depends_on:
      api: { condition: service_started }

volumes:
  mongo-data:
